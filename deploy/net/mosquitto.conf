# net.goath1.com's MQTT broker: internet play's signalling, parties, friends
# and the server browser's listings (port/linux/src/p2p_signal.c). An
# anonymous public broker, so it carries only the game's topics (goath1.acl)
# and keeps each client small. Installed as /etc/mosquitto/mosquitto.conf
# (Mosquitto 2.0, Ubuntu 24.04's package); README.md says how.

per_listener_settings false

# MQTT 5 and 3.1.1 on 1883, IPv4 and IPv6, no TLS (everything the game sends
# through a broker is sealed end to end: p2p_signal.c)
listener 1883
protocol mqtt
max_connections 4000
allow_anonymous true
acl_file /etc/mosquitto/goath1.acl

# The largest packet the game sends is about 620 bytes (a sealed 512-byte
# message, a 64-byte topic and the headers): a third of this
max_packet_size 2048
# per client: what a slow client may have waiting, and unacknowledged (the
# game keeps 4 in flight and reads at once)
max_inflight_messages 20
max_queued_messages 100
max_queued_bytes 65536
# the game asks 60 seconds
max_keepalive 300
set_tcp_nodelay true
# the server browser's listings are retained, and expire (MQTT 5)
retain_available true
# the whole broker's memory, of the box's 2 GB
memory_limit 805306368

# Retained listings kept through a restart (each with its expiry, which the
# broker honours after it). The game's sessions are clean: nothing else is
# kept for them.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60
persistent_client_expiration 1d

pid_file /run/mosquitto/mosquitto.pid
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages false
