      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8E6E9"/>
    </linearGradient>
    <mask id="grooves">
      <rect x="0" y="0" width="48" height="48" fill="#FFFFFF"/>
      <rect x="0" y="27" width="48" height="2.5" fill="#000000"/>
      <rect x="0" y="35.5" width="48" height="2.5" fill="#000000"/>
    </mask>
  </defs>
  <circle cx="20" cy="31" r="16" fill="#FFFFFF" mask="url(#grooves)"/>
  <rect x="13" y="6" width="14" height="7" rx="2" fill="#FFFFFF"/>
  <path d="M27.5 9.5 Q41 9.5 42.5 23" fill="none" stroke="url(#shade)" stroke-width="5" stroke-linecap="round"/>
