<!doctype html>
<!-- The share picture of /maps (public/media/og-maps.jpg), 1200 x 630, as
     the home page's og.jpg lays out its words, over a drawn disc rather
     than the game. Rendered by render.sh here. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; font-weight: 100 900; font-stretch: 62% 125%; src: url("../public/fonts/Archivo-Latin.woff2") format("woff2"); }
  @font-face { font-family: "Overpass Mono"; font-weight: 400 700; src: url("../public/fonts/OverpassMono-Latin.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: #eef4ea;
    background:
      radial-gradient(ellipse 55% 75% at 78% 45%, rgba(157, 255, 60, 0.16), rgba(157, 255, 60, 0) 70%),
      radial-gradient(ellipse 120% 100% at 50% 0%, #0b1209, #040504 70%);
  }
  /* the hero's scanlines, faint */
  body::after { content: ""; position: absolute; inset: 0; z-index: 0; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.26) 0 1px, transparent 1px 3px); }
  .lockup, .disc, h1, .tag { z-index: 1; }
  .lockup { position: absolute; left: 72px; top: 72px; width: 258px; }
  .disc { position: absolute; right: -40px; top: 40px; width: 560px; height: 560px; filter: drop-shadow(0 0 28px rgba(157, 255, 60, 0.35)); }
  h1 { position: absolute; left: 72px; bottom: 112px; margin: 0; font: 900 118px/0.9 "Archivo"; font-stretch: 116%; letter-spacing: -0.02em; text-transform: uppercase; }
  h1 span { display: block; }
  h1 .lit { color: #9dff3c; text-shadow: 0 0 40px rgba(157, 255, 60, 0.42), 0 0 2px rgba(157, 255, 60, 0.8); }
  .tag { position: absolute; left: 72px; bottom: 66px; margin: 0; color: #9dff3c; font: 500 17px/1 "Overpass Mono"; letter-spacing: 0.22em; text-transform: uppercase; }
</style>
</head>
<body>
  <svg class="disc" viewBox="0 0 560 560" fill="none" stroke-linecap="round">
    <circle cx="280" cy="280" r="250" stroke="#9dff3c" stroke-opacity="0.85" stroke-width="3"/>
    <circle cx="280" cy="280" r="214" stroke="#9dff3c" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="280" cy="280" r="178" stroke="#9dff3c" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="280" cy="280" r="142" stroke="#9dff3c" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="280" cy="280" r="78" stroke="#9dff3c" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="280" cy="280" r="26" stroke="#9dff3c" stroke-opacity="0.85" stroke-width="3"/>
    <!-- a glint across the tracks -->
    <path d="M280 30 A250 250 0 0 1 497 155" stroke="#eef4ea" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M280 66 A214 214 0 0 1 465 173" stroke="#eef4ea" stroke-opacity="0.22" stroke-width="2"/>
  </svg>
  <img class="lockup" src="../public/brand/openh1-lockup.svg" alt="">
  <h1><span>Get your</span><span class="lit">maps.</span></h1>
  <p class="tag">Your disc · copied once · every machine</p>
</body>
</html>
