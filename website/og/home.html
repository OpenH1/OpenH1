<!doctype html>
<!-- The share picture of the home page (public/media/og.jpg), 1200 x 630:
     the logo and the hero's headline over a capture of Blood Gulch (media/ao-on.webp). Rendered by
     render.sh here (og/render.sh home). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; font-weight: 100 900; font-stretch: 62% 125%; src: url("../public/fonts/Archivo-Latin.woff2") format("woff2"); }
  @font-face { font-family: "Overpass Mono"; font-weight: 400 700; src: url("../public/fonts/OverpassMono-Latin.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: #eef4ea; background: #040504 url("../public/media/ao-on.webp") center / cover no-repeat; }
  /* the hero's shade, so the words read over the game */
  body::before { content: ""; position: absolute; inset: 0; z-index: 0;
    background:
      linear-gradient(90deg, rgba(4, 5, 4, 0.78) 0%, rgba(4, 5, 4, 0.35) 55%, rgba(4, 5, 4, 0.1) 100%),
      linear-gradient(0deg, rgba(4, 5, 4, 0.92) 0%, rgba(4, 5, 4, 0.2) 55%, rgba(4, 5, 4, 0.15) 100%); }
  .lockup, h1, .tag { z-index: 1; }
  .lockup { position: absolute; left: 72px; top: 72px; width: 256px; }
  h1 { position: absolute; left: 72px; bottom: 112px; margin: 0; font: 900 104px/0.9 "Archivo"; white-space: nowrap; font-stretch: 116%; letter-spacing: -0.02em; text-transform: uppercase; }
  h1 span { display: block; }
  h1 .lit { color: #9dff3c; text-shadow: 0 0 40px rgba(157, 255, 60, 0.42), 0 0 2px rgba(157, 255, 60, 0.8); }
  .tag { position: absolute; left: 72px; bottom: 66px; margin: 0; color: #9dff3c; font: 500 17px/1 "Overpass Mono"; letter-spacing: 0.22em; text-transform: uppercase; }
</style>
</head>
<body>
  <img class="lockup" src="../public/brand/goath1-lockup.svg" alt="">
  <h1><span>Welcome back,</span><span class="lit">soldier.</span></h1>
  <p class="tag">The original, recompiled · Mac · Linux · Android · VR</p>
</body>
</html>
